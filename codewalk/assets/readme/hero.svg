<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">codewalk</title>
  <desc id="desc">codewalk: your agent shows you the code behind its answer, as a walk that waits for you. A code pane highlights lines 27 to 30, a note under them says "Here it decides if another loan is due", and a route of five numbered stops runs beside it with stop 3 current.</desc>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3fa9f5"/>
      <stop offset="0.45" stop-color="#3fa9f5" stop-opacity="0"/>
      <stop offset="1" stop-color="#ff8a5c"/>
    </linearGradient>
    <linearGradient id="route" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#72c3fa"/>
      <stop offset="1" stop-color="#ffa94d"/>
    </linearGradient>
    <clipPath id="pane"><rect x="0" y="0" width="520" height="356" rx="12"/></clipPath>
  </defs>

  <rect width="1200" height="420" rx="24" fill="#1e1f22"/>

  <g id="title-block" transform="translate(64 0)">
    <text x="0" y="104" fill="#9a9ea6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="1">A SKILL FOR CODING AGENTS</text>
    <text x="-3" y="186" fill="#dfe1e5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="84" font-weight="700" letter-spacing="-2">codewalk</text>
    <text x="0" y="240" fill="#b4b7bd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="27">Your agent shows you the code behind</text>
    <text x="0" y="276" fill="#b4b7bd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="27">its answer, as a walk that waits for you.</text>
    <text x="0" y="336" fill="#9a9ea6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">any language · local · read-only</text>
  </g>

  <g id="route" transform="translate(604 62)">
    <path d="M0 0 C 12 50, -12 90, 0 140 C 12 190, -12 230, 0 280" fill="none" stroke="#393b40" stroke-width="2"/>
    <path d="M0 0 C 12 50, -12 90, 0 140" fill="none" stroke="url(#route)" stroke-width="2.5"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" text-anchor="middle">
      <circle cx="0" cy="0" r="14" fill="#1e1f22" stroke="#72c3fa" stroke-width="2"/><text x="0" y="5.5" fill="#72c3fa">1</text>
      <circle cx="0" cy="70" r="14" fill="#1e1f22" stroke="#72c3fa" stroke-width="2"/><text x="0" y="75.5" fill="#72c3fa">2</text>
      <circle cx="0" cy="140" r="21" fill="#72c3fa" fill-opacity="0.18"/>
      <circle cx="0" cy="140" r="14" fill="#72c3fa"/><text x="0" y="145.5" fill="#0c1a26" font-weight="700">3</text>
      <circle cx="0" cy="210" r="14" fill="#1e1f22" stroke="#393b40" stroke-width="2"/><text x="0" y="215.5" fill="#9a9ea6">4</text>
      <circle cx="0" cy="280" r="14" fill="#1e1f22" stroke="#393b40" stroke-width="2"/><text x="0" y="285.5" fill="#9a9ea6">5</text>
    </g>
  </g>

  <g id="code-pane" transform="translate(648 32)">
    <g clip-path="url(#pane)">
      <rect width="520" height="356" fill="#1a1b1e"/>
      <rect width="520" height="40" fill="#2b2d30"/>
      <text x="18" y="26" fill="#b4b7bd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">loans/loan_service.py</text>
      <rect x="0" y="108" width="520" height="120" fill="#ffa94d" fill-opacity="0.08"/>
      <rect x="0" y="108" width="3" height="120" fill="#d98a3d"/>
      <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#bcbec4">
        <g fill="#6f737a" text-anchor="end"><text x="42" y="68">25</text><text x="42" y="98">26</text></g>
        <g fill="#ffa94d" text-anchor="end"><text x="42" y="128">27</text><text x="42" y="158">28</text><text x="42" y="188">29</text><text x="42" y="218">30</text></g>
        <text x="62" y="68" xml:space="preserve"><tspan fill="#cf8e6d">if not</tspan> member.is_subscribed:</text>
        <text x="62" y="98" xml:space="preserve">    <tspan fill="#cf8e6d">raise</tspan> NotSubscribed(member)</text>
        <text x="62" y="128" xml:space="preserve">monthly = self.policy.<tspan fill="#56a8f5">monthly</tspan>(member)</text>
        <text x="62" y="158" xml:space="preserve">used = self.loans.<tspan fill="#56a8f5">this_month</tspan>(member)</text>
        <text x="62" y="188" xml:space="preserve"><tspan fill="#cf8e6d">if</tspan> used &gt;= monthly:</text>
        <text x="62" y="218" xml:space="preserve">    <tspan fill="#cf8e6d">raise</tspan> LoanLimitReached(member)</text>
      </g>
      <g id="note" transform="translate(24 244)">
        <rect width="472" height="92" rx="12" fill="#2b2d30"/>
        <rect x="0.75" y="0.75" width="470.5" height="90.5" rx="12" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
        <text x="20" y="32" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18"><tspan fill="#72c3fa" font-weight="700">3 / 5</tspan><tspan fill="#9a9ea6">  LoanService#assign</tspan></text>
        <text x="20" y="68" fill="#dfe1e5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22">Here it decides if another loan is due.</text>
      </g>
    </g>
    <rect width="520" height="356" rx="12" fill="none" stroke="#393b40"/>
  </g>
</svg>
