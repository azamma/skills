<svg width="100%" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="En criollo: termo y mate al atardecer en la pampa; la jerga 'orden en PENDING_CONFIRMATION, cron a los 15 min' tachada y traducida a 'Quedó en espera unos 15 minutos y se cerró sola.'">
  <defs>
    <clipPath id="card">
      <rect width="1200" height="320" rx="18"/>
    </clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22180f"/>
      <stop offset="60%" stop-color="#4a2f1c"/>
      <stop offset="100%" stop-color="#6b3f22"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f6d36a"/>
      <stop offset="100%" stop-color="#e0a23f"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f2a94c" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#f2a94c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#sky)"/>

    <!-- sol poniéndose detrás del mate -->
    <circle cx="250" cy="226" r="200" fill="url(#halo)"/>
    <circle cx="250" cy="226" r="84" fill="url(#sun)"/>

    <!-- pampa -->
    <path d="M0 236 Q 320 214 640 244 T 1200 262 V320 H0 Z" fill="#5c6b47"/>
    <path d="M0 262 Q 380 246 760 270 T 1200 282 V320 H0 Z" fill="#3f4c30"/>
    <g stroke="#7c8f5c" stroke-width="3" stroke-linecap="round" opacity="0.7">
      <path d="M48 262 l-6 -16"/><path d="M78 266 l-4 -18"/><path d="M450 262 l-6 -15"/>
      <path d="M1060 284 l-6 -16"/><path d="M1100 288 l-5 -17"/><path d="M1140 286 l-7 -15"/>
    </g>

    <!-- termo tipo Stanley: cuerpo verde martillado, aros de metal, vaso-tapa y asa lateral -->
    <g transform="translate(170,252)">
      <ellipse cx="6" cy="2" rx="50" ry="7" fill="#2c3520" opacity="0.6"/>
      <path d="M34 -150 H50 Q60 -150 60 -140 V-56 Q60 -46 50 -46 H34" fill="none" stroke="#2c4a34" stroke-width="11" stroke-linejoin="round"/>
      <path d="M34 -150 H50 Q60 -150 60 -140 V-56 Q60 -46 50 -46 H34" fill="none" stroke="#4f7d5c" stroke-width="5" stroke-linejoin="round"/>
      <rect x="-34" y="-166" width="68" height="166" rx="10" fill="#4f7d5c" stroke="#2c4a34" stroke-width="3"/>
      <g fill="#8fb59a" opacity="0.35">
        <circle cx="-14" cy="-140" r="3"/><circle cx="8" cy="-122" r="2.5"/><circle cx="-6" cy="-98" r="3"/>
        <circle cx="16" cy="-80" r="2.5"/><circle cx="-16" cy="-62" r="3"/><circle cx="10" cy="-44" r="2.5"/>
        <circle cx="-4" cy="-30" r="2"/><circle cx="20" cy="-142" r="2"/>
      </g>
      <rect x="-24" y="-156" width="8" height="140" rx="4" fill="#ffffff" opacity="0.14"/>
      <rect x="-36" y="-14" width="72" height="14" rx="5" fill="#c9c9c2" stroke="#7d7d76" stroke-width="2"/>
      <rect x="-31" y="-180" width="62" height="16" rx="4" fill="#c9c9c2" stroke="#7d7d76" stroke-width="2"/>
      <path d="M-29 -180 L-25 -218 Q-25 -222 -21 -222 H21 Q25 -222 25 -218 L29 -180 Z" fill="#43704f" stroke="#2c4a34" stroke-width="3"/>
      <rect x="-25" y="-224" width="50" height="8" rx="4" fill="#2c4a34"/>
    </g>

    <!-- mate de calabaza: virola de metal, montañita de yerba, bombilla -->
    <g transform="translate(318,252)">
      <ellipse cx="0" cy="2" rx="40" ry="6" fill="#2c3520" opacity="0.6"/>
      <path d="M7 -108 L38 -168" stroke="#8a8a84" stroke-width="8" stroke-linecap="round"/>
      <path d="M7 -108 L38 -168 Q42 -176 52 -176" fill="none" stroke="#d8d8d0" stroke-width="5" stroke-linecap="round"/>
      <path d="M0 0 C-48 0 -54 -42 -40 -64 C-32 -78 -24 -84 -24 -98 H24 C24 -84 32 -78 40 -64 C54 -42 48 0 0 0 Z" fill="#8a5a32" stroke="#4a2f19" stroke-width="3"/>
      <path d="M-30 -60 C-38 -42 -34 -20 -20 -12" fill="none" stroke="#c48a55" stroke-width="5" stroke-linecap="round" opacity="0.5"/>
      <path d="M-24 -106 Q-10 -128 12 -116 Q20 -112 24 -106 Z" fill="#7c9a3e" stroke="#4f6627" stroke-width="2"/>
      <rect x="-27" y="-108" width="54" height="14" rx="4" fill="#c9c9c2" stroke="#7d7d76" stroke-width="2"/>
      <g stroke="#f2e8d5" stroke-width="3" fill="none" opacity="0.6" stroke-linecap="round">
        <path d="M-10 -126 Q -18 -142 -8 -156 Q 0 -170 -8 -184"/>
        <path d="M8 -128 Q 0 -142 10 -156"/>
      </g>
    </g>

    <!-- wordmark -->
    <text x="560" y="104" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" fill="#f2e8d5">en criollo</text>
    <text x="562" y="142" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#e0a23f">lo técnico, contado como se cuenta al lado del fogón</text>

    <!-- antes / después -->
    <text x="562" y="190" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#a8927a" text-decoration="line-through">orden en PENDING_CONFIRMATION, cron a los 15 min</text>
    <text x="562" y="226" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#f2e8d5"><tspan fill="#e0a23f">→ </tspan>Quedó en espera unos 15 minutos y se cerró sola.</text>
  </g>
</svg>
