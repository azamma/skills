<svg width="100%" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="En criollo: termo y mate al atardecer en la pampa">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b1f14"/>
      <stop offset="55%" stop-color="#4a2f1c"/>
      <stop offset="100%" stop-color="#1a1410"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f2c94c"/>
      <stop offset="100%" stop-color="#d9a441"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#sky)"/>

  <circle cx="990" cy="110" r="72" fill="url(#sun)"/>

  <!-- pampa horizon -->
  <path d="M0 230 Q 300 195 620 220 T 1200 210 V320 H0 Z" fill="#5c6b47" opacity="0.9"/>
  <path d="M0 250 Q 350 225 700 245 T 1200 238 V320 H0 Z" fill="#3f4c30"/>

  <!-- grass strokes -->
  <g stroke="#7c8f5c" stroke-width="3" stroke-linecap="round" opacity="0.7">
    <path d="M60 248 l-6 -16"/><path d="M90 252 l-4 -18"/><path d="M130 250 l-7 -15"/>
    <path d="M980 244 l-6 -16"/><path d="M1030 248 l-5 -17"/><path d="M1090 246 l-7 -15"/>
    <path d="M1140 250 l-4 -16"/>
  </g>

  <!-- termo -->
  <g transform="translate(255,190)">
    <rect x="-30" y="-118" width="60" height="16" rx="6" fill="#8a2f22"/>
    <rect x="-18" y="-104" width="36" height="10" fill="#c8c2b0"/>
    <path d="M-34 -92 Q-40 -20 -30 30 Q0 42 30 30 Q40 -20 34 -92 Z" fill="#b3502f"/>
    <path d="M-34 -92 Q-40 -20 -30 30 Q0 42 30 30 Q40 -20 34 -92 Z" fill="none" stroke="#8a2f22" stroke-width="3"/>
    <rect x="-34" y="-46" width="68" height="10" fill="#d9a441"/>
    <rect x="-34" y="-18" width="68" height="10" fill="#f2e8d5" opacity="0.85"/>
    <circle cx="0" cy="-116" r="3" fill="#4a2f1c"/>
  </g>

  <!-- mate -->
  <g transform="translate(420,210)">
    <path d="M-30 -6 Q-34 34 0 44 Q34 34 30 -6 Q30 -30 0 -32 Q-30 -30 -30 -6 Z" fill="#3f4c30"/>
    <path d="M-30 -6 Q-34 34 0 44 Q34 34 30 -6" fill="none" stroke="#2c3520" stroke-width="3"/>
    <ellipse cx="0" cy="-30" rx="20" ry="7" fill="#5c6b47"/>
    <ellipse cx="0" cy="-30" rx="20" ry="7" fill="none" stroke="#2c3520" stroke-width="2"/>
    <rect x="-4" y="-16" width="8" height="10" fill="#d9a441" opacity="0.9"/>
    <!-- bombilla -->
    <path d="M2 -34 L44 -70" stroke="#c8c2b0" stroke-width="7" stroke-linecap="round"/>
    <circle cx="46" cy="-72" r="6" fill="#c8c2b0"/>
  </g>

  <!-- vapor del mate -->
  <g stroke="#f2e8d5" stroke-width="3" fill="none" opacity="0.55" stroke-linecap="round">
    <path d="M-6 -96 Q -14 -112 -4 -126 Q 4 -140 -4 -154" transform="translate(420,210)"/>
    <path d="M14 -100 Q 6 -114 16 -128" transform="translate(420,210)"/>
  </g>

  <!-- wordmark -->
  <text x="620" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" fill="#f2e8d5">en criollo</text>
  <text x="622" y="188" font-family="-apple-system, Segoe UI, sans-serif" font-size="22" fill="#d9a441">lo técnico, contado como se cuenta al lado del fogón</text>
</svg>
